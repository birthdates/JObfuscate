<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Vibrant Blue-Cyan Gradients -->
    <linearGradient id="cyber-cyan-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="facet-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="facet-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.10" />
    </linearGradient>
    <linearGradient id="facet-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0.30" />
    </linearGradient>
    <!-- Subtle Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Isometric Hexagon -->
  <polygon 
    points="50,6 88,28 88,72 50,94 12,72 12,28" 
    stroke="url(#cyber-cyan-blue)" 
    stroke-width="3" 
    stroke-linejoin="round" 
    fill="#0f172a" 
    fill-opacity="0.6"
    filter="url(#neon-glow)"
  />

  <!-- Outer Cube Isometric Internal Y-Axis Lines -->
  <line x1="50" y1="50" x2="50" y2="94" stroke="#0284c7" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />
  <line x1="50" y1="50" x2="12" y2="28" stroke="#0284c7" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />
  <line x1="50" y1="50" x2="88" y2="28" stroke="#0284c7" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />

  <!-- Inner Floating Cube (Hardened Core) -->
  <!-- Top Face -->
  <polygon 
    points="50,26 69,37 50,48 31,37" 
    fill="url(#facet-top)" 
    stroke="#38bdf8" 
    stroke-width="2" 
    stroke-linejoin="round" 
  />
  <!-- Left Face -->
  <polygon 
    points="31,37 50,48 50,70 31,59" 
    fill="url(#facet-left)" 
    stroke="#0284c7" 
    stroke-width="2" 
    stroke-linejoin="round" 
  />
  <!-- Right Face -->
  <polygon 
    points="50,48 69,37 69,59 50,70" 
    fill="url(#facet-right)" 
    stroke="#2563eb" 
    stroke-width="2" 
    stroke-linejoin="round" 
  />

  <!-- Internal Diagonal Struts (Tesseract / Hypercube Security Links) -->
  <line x1="50" y1="6" x2="50" y2="26" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="88" y1="72" x2="69" y2="59" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="12" y1="72" x2="31" y2="59" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

  <!-- Accent Nodes at Key Intersection Points -->
  <circle cx="50" cy="48" r="2.5" fill="#38bdf8" filter="url(#neon-glow)" />
  <circle cx="50" cy="26" r="2" fill="#38bdf8" />
  <circle cx="69" cy="37" r="2" fill="#38bdf8" />
  <circle cx="31" cy="37" r="2" fill="#38bdf8" />
  <circle cx="50" cy="70" r="2" fill="#38bdf8" />
</svg>
