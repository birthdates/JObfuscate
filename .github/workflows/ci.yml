name: CI Build and Obfuscation Test Matrix

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    name: ${{ matrix.os }} - C++23 & Java Matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Install C++23 Compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 gcc-14
          echo "CC=gcc-14" >> $GITHUB_ENV
          echo "CXX=g++-14" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ Obfuscator Engine & CLI
        run: |
          cmake --build build --config Release --parallel

      - name: Run Obfuscation Test Suite (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tests/run_tests.ps1

      - name: Run Obfuscation Test Suite (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x tests/run_tests.sh
          ./tests/run_tests.sh
