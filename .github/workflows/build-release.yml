name: Build & Package (CLI & GUI)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release Tag (optional, e.g. v1.0.0 — leave empty to only upload workflow artifacts)'
        required: false
        default: ''
        type: string
      draft:
        description: 'Publish as draft release'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-22.04
            platform: linux-x64
          - os: macos-latest
            platform: macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: gui/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri -> target

      # Linux system dependencies & C++23 compiler
      - name: Install Linux Dependencies & C++23 Compiler
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y \
            g++-14 gcc-14 \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2
          echo "CC=gcc-14" >> $GITHUB_ENV
          echo "CXX=g++-14" >> $GITHUB_ENV

      # Build C++ Engine & CLI
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ CLI
        run: cmake --build build --config Release --parallel

      # Verify and stage CLI for Tauri packaging
      - name: Stage CLI for GUI Packaging
        run: node gui/scripts/copy-cli.js

      # Install GUI dependencies
      - name: Install GUI Node Dependencies
        working-directory: gui
        run: npm ci

      # Build GUI desktop app via Tauri
      - name: Build Tauri Desktop App
        working-directory: gui
        run: npm run tauri build

      # Stage Windows Artifacts
      - name: Stage Windows Artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist-artifacts"
          if (Test-Path "build/core/Release/obfuscator_cli.exe") {
            Copy-Item "build/core/Release/obfuscator_cli.exe" -Destination "dist-artifacts/obfuscator_cli-windows-x64.exe"
          } elseif (Test-Path "build/core/obfuscator_cli.exe") {
            Copy-Item "build/core/obfuscator_cli.exe" -Destination "dist-artifacts/obfuscator_cli-windows-x64.exe"
          }
          if (Test-Path "gui/src-tauri/target/release/JObfuscate.exe") {
            Copy-Item "gui/src-tauri/target/release/JObfuscate.exe" -Destination "dist-artifacts/JObfuscate.exe"
          }
          Get-ChildItem -Path "gui/src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | Copy-Item -Destination "dist-artifacts/"
          Get-ChildItem -Path "gui/src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Copy-Item -Destination "dist-artifacts/"
          Get-ChildItem -Path "dist-artifacts"

      # Stage Linux Artifacts
      - name: Stage Linux Artifacts
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist-artifacts
          if [ -f "build/core/obfuscator_cli" ]; then
            cp build/core/obfuscator_cli dist-artifacts/obfuscator_cli-linux-x64
          elif [ -f "build/core/Release/obfuscator_cli" ]; then
            cp build/core/Release/obfuscator_cli dist-artifacts/obfuscator_cli-linux-x64
          fi
          chmod +x dist-artifacts/obfuscator_cli-linux-x64
          cp gui/src-tauri/target/release/bundle/appimage/*.AppImage dist-artifacts/ 2>/dev/null || true
          cp gui/src-tauri/target/release/bundle/deb/*.deb dist-artifacts/ 2>/dev/null || true
          ls -la dist-artifacts

      # Stage macOS Artifacts
      - name: Stage macOS Artifacts
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist-artifacts
          if [ -f "build/core/obfuscator_cli" ]; then
            cp build/core/obfuscator_cli dist-artifacts/obfuscator_cli-macos
          elif [ -f "build/core/Release/obfuscator_cli" ]; then
            cp build/core/Release/obfuscator_cli dist-artifacts/obfuscator_cli-macos
          fi
          chmod +x dist-artifacts/obfuscator_cli-macos
          cp gui/src-tauri/target/release/bundle/dmg/*.dmg dist-artifacts/ 2>/dev/null || true
          ls -la dist-artifacts

      # Upload Artifacts for this platform
      - name: Upload Platform Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JObfuscate-${{ matrix.platform }}
          path: dist-artifacts/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build
    if: inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: JObfuscate-*
          merge-multiple: true

      - name: List Release Assets
        run: ls -la release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.release_tag }}
          name: JObfuscate ${{ inputs.release_tag }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          files: release-assets/*
          generate_release_notes: true

